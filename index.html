<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Felines Background</title>
    <style>
        body {
            margin: 0;
            padding: 0;
        }
        
        .background-section {
            width: 100vw;
            height: 100vh;
            background-image: url('Starter.png');
            background-size: auto;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
        }
        
        .wild-cats-banner {
            position: absolute;
            top: 15px;
            left: 42px;
            font-size: 72pt;
            font-family: 'Franklin Gothic Demi Cond', sans-serif;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }
        
        header {
            position: absolute;
            top: 35px;
            right: 0;
            display: flex;
            gap: 40px;
            padding-right: 42px;
        }
        
        header nav {
            display: flex;
            gap: 40px;
        }
        
        header nav a {
            font-size: 72pt;
            font-family: 'Franklin Gothic Medium Cond', sans-serif;
            color: white;
            text-decoration: none;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body>
    <section class="background-section">
        <div class="wild-cats-banner">WILD CATS</div>
        <header>
            <nav>
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Species</a>
            </nav>
        </header>
    </section>
</body>
</html>
